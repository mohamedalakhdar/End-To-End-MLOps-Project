name: FastAPI CI Pipeline

on:
  push:
    branches:
      - "main"

env:
  PYTHON_VERSION: "3.13"      

jobs:
  lint-and-format:
    name: Code Quality check (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up uv   
        uses: astral-sh/setup-uv@v5

      - name: Set UP Python   
        run: uv python install ${{env.PYTHON_VERSION}}

      - name: Install Dependencies
        run: uv sync --frozen --only-group lint --no-install-project

      - name: Check Code Formating
        run: uv run ruff format --check .

      - name: Run Ruff Linter 
        run: uv run ruff check .    

  test-and-coverage:
    name: Run Tests and Check test-and-coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up uv   
        uses: astral-sh/setup-uv@v5

      - name: Set UP Python   
        run: uv python install ${{env.PYTHON_VERSION}}

      - name: Install Dependencies
        run: uv sync --frozen --only-group dev --no-install-project 
        
      - name: Run Tests with Coverage 
        run: uv run pytest --cov=src --cov-fail-under=80    
        env:
         MODEL_PATH: models/xgboost_model.pkl
       
  build-and-push:
    name: Build Docker Image and Push to Docker Hub
    runs-on: ubuntu-latest
    needs: [lint-and-format, test-and-coverage]
    steps: 
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log Into Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Build and Push Docker Image 
        uses: docker/build-push-action@v6
        env:
          IMAGE_NAME: fastapi-fraud
        with:
          context: .
          file: ./Dockerfile
          push: true   
          tags: |
            ${{secrets.DOCKERHUB_USERNAME}}/${{env.IMAGE_NAME}}:latest  
            ${{secrets.DOCKERHUB_USERNAME}}/${{env.IMAGE_NAME}}${{github.sha}}   
            
          cache-from: type=gha
          cache-to: type=gha, mode=max   


           
   